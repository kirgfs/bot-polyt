[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-scout"
version = "0.1.0"
description = "Скаут кошельков Hyperliquid perps для стороннего copy-бота: кого копировать, с какими настройками и когда прекратить"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6,<7",
    "structlog>=24",
    "numpy>=1.26",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.5",
]

[project.scripts]
hl-scout = "hl_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: нужен доступ к api.hyperliquid.xyz (по умолчанию пропускаются)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — намеренно

[tool.ruff.lint.per-file-ignores]
"src/hl_scout/report.py" = ["E501"]  # длинные строки — текст отчёта для человека

[tool.ruff.lint.isort]
known-first-party = ["hl_scout"]
known-local-folder = ["helpers", "synth"]
