# Поля стороннего copy-бота в порядке его меню и их семантика.
#
# Бот: ApexLiquid (https://apexliquid.bot, Telegram @Apexliquid_bot).
# Поля из раздела 13 ТЗ совпадают с его меню.
#
# Источники (прочитаны 2026-09-26):
# - docs: документация бота https://apexliquid.gitbook.io/apexliquid. Страницы:
#     basics/copytrade                        — формулы покупки и продажи, режимы кошелька;
#     basics/copytrade/copy-trading-settings  — все поля настроек;
#     basics/editor (FAQ)                     — комиссия бота, минимум сделки;
#     readme, getting-started/quickstart      — скорость копирования.
# - ui: веб-форма «Create a Copy Trade» (JS-бандл https://apexliquid.bot/assets/index-*.js).
#   Из неё взяты имена полей в модели настроек (api_key), единицы, диапазоны и значения по умолчанию.
#
# Статусы полей:
# - verified: поведение описано в документации бота;
# - verified_by_user_spec: задано ТЗ;
# - ui: поле есть в форме бота, в документации не описано;
# - unverified: поля нет ни в документации, ни в веб-форме (возможно, есть только в Telegram-меню).
# Сообщение «НАСТРОЙКИ» не выдаётся, пока хоть одно поле не подтверждено (fail-closed).

bot:
  name: ApexLiquid
  docs_url: https://apexliquid.gitbook.io/apexliquid
  fee_bps: 4.5                 # docs/FAQ: «Apexliquid charges a 0.045% fee per filled order»
  fee_status: verified
  # docs/readme: «copies smart money trades within 1 second». В бэктесте остаётся задержка из ТЗ (10–30 с,
  # расчёт по худшей) — это консервативно.

# Как бот исполняет копию. Эти ключи читает симулятор (src/hl_scout/sim.py).
semantics:
  event_granularity: order          # ДОПУЩЕНИЕ: копирует ордер трейдера целиком (филлы одного oid склеены)
  # docs/copytrade: «Your Copy Size = (Target Size ÷ Target Balance) × Your Balance × Copy Ratio».
  # Target Balance — account value трейдера в момент сделки, Your Balance — баланс моего копи-кошелька.
  ratio_applies_to: balance_scaled
  ratio_min: 0.01                   # ui: поле Copy Ratio, min 0.01
  ratio_max: 10                     # ui: поле Copy Ratio, max 10
  # docs/copytrade: «Your sell size = (Target address's sell size / Target address's total size) × Your total size».
  reduce_mode: proportional
  full_close_on_trader_flat: true   # следует из формулы продажи: трейдер продал всё → я продаю всё
  # docs/settings «Not copy open, No copy Increase»: только при включённой опции доливка без моей позиции
  # не открывает её. Опция выключена → доливка открывает позицию («поздний вход»).
  increase_without_position: open
  # docs/settings «Min/Max Trade Size»: «Minimum size = $15»; FAQ: «minimum position size of 15 USDC».
  # В FAQ п. 8 и в веб-форме — $10. Берём $15: более высокий минимум консервативнее для депозита $50.
  min_copy_usd: 15
  # docs/settings «Your Copy Size > $15»: копия меньше минимума ждёт 31 с; если так и осталась меньше —
  # по умолчанию не копируется, с включённой опцией бот покупает на минимум.
  small_wait_s: 31
  # Раздел называется «Risk Limits on Buy Orders»: правило минимума — для покупок. Частичная продажа меньше
  # минимума биржи ($10) не отправляется (ДОПУЩЕНИЕ: биржа не примет такой ордер); полное закрытие разрешено.
  small_size_applies_to_reduce: false
  reduce_min_usd: 10
  allow_small_full_close: true      # ДОПУЩЕНИЕ: закрытие всей позиции < $10 проходит (reduce-only)
  # docs/settings «Buy Isolated Margin Tokens»: только при включённой опции копируются монеты с одной
  # isolated-маржой. Отсюда же: остальные монеты бот торгует в cross.
  margin_mode: cross
  skip_isolated_only: true
  # docs/settings «Fellow Leverage/Max Leverage»: плечо трейдера или максимальное плечо монеты; фиксированного
  # нет. Исторических плеч трейдера в API нет, поэтому бэктест считает вариант Max Leverage.
  leverage_mode: max
  price_sl_basis: price             # docs: «close the position based on the price increase or decrease %»
  balance_sl_basis: level           # docs: «When your balance drops below the set SL amount…»
  balance_trigger_action: close_all_and_stop  # docs: «…close all positions and stop active status»
  balance_tp_simulated: false       # Balance TP в бэктесте не применяется (иначе P(>= $1000) = 0 по построению)
  buy_times_counts_open: true       # docs: «Max number of entries per token»
  follow_leverage_when_unknown: fixed

# Порядок — меню бота (ТЗ, раздел 13; совпадает с порядком в документации).
fields:
  - key: target_wallet
    label: "Target Wallet"
    api_key: target_address
    unit: address
    logic: "Адрес из рекомендации СЛЕДИТЬ (торгующий адрес: субаккаунт, если торгует он). Копировать через Sub-Wallet Copy: у копии свой адрес и свой Balance SL"
    status: verified_by_user_spec
    source: docs/copytrade (Main Wallet Copy vs Sub-Wallet Copy)
  - key: tag
    label: "Tag"
    api_key: tag
    unit: text
    range: "до 20 символов"
    logic: "Профиль риска + дата: CONS_0926 / MED_0926 / AGGR_0926"
    status: verified_by_user_spec
    source: ui
  - key: reverse_copy
    label: "Reverse Copy"
    api_key: reverse_copy
    unit: bool
    default: "OFF"
    logic: "OFF. Бот открывает сделки в обратную сторону — рекомендуем только если реверс прибылен out-of-sample (по умолчанию нет)"
    status: verified
    source: docs/copy-trading-settings
  - key: copy_ratio
    label: "Copy Ratio"
    api_key: copy_ratio
    unit: x
    range: "0.01–10"
    default: "1"
    logic: >-
      Мой размер = (размер трейдера ÷ баланс трейдера) × мой баланс × ratio. ratio = целевая позиция × медианный
      баланс трейдера / (медианная позиция трейдера × мой депозит), округление вниз до 2 значащих цифр. Если нужный
      ratio вне 0.01–10, такой размер позиции недостижим.
    status: verified
    source: docs/copytrade, docs/copy-trading-settings
  - key: copy_limit_order
    label: "Copy Limit Order"
    unit: bool
    logic: "OFF: бэктест моделирует бота без этой опции. В документации и веб-форме поля нет"
    status: unverified
  - key: copy_existing_positions
    label: "Copy Existing positions"
    api_key: copy_existing_position
    unit: bool
    default: "OFF (в форме создания)"
    logic: "OFF — не входить в открытые позиции трейдера по устаревшей цене"
    status: verified
    source: docs/copy-trading-settings
  - key: not_copy_open_increase
    label: "Not Copy Open, No Copy Increase"
    unit: bool
    logic: "OFF: доливка трейдера, когда моей позиции нет, открывает позицию (так считает бэктест). ON — если в бэктесте поздние входы убыточны"
    status: verified
    source: docs/copy-trading-settings
  - key: price_tp_sl
    label: "Price TP / Price SL (%)"
    api_key: tp_trigger / sl_trigger
    unit: pct
    range: "0–100, до 2 знаков"
    logic: "% движения цены от входа. SL — дальше p95 MAE кошелька, но ближе моей ликвидации; TP — только если бэктест показывает пользу, иначе «-»"
    status: verified
    source: docs/copy-trading-settings
  - key: balance_tp_sl
    label: "Balance TP / Balance SL ($)"
    api_key: tp_balance / sl_balance
    unit: usd
    logic: "Уровень баланса копи-кошелька: пересёк — бот закрывает всё и останавливается. Balance SL = потолок убытка проекта ($30 при старте $50); Balance TP = уровень «выведи прибыль» ($100)"
    status: verified
    source: docs/copy-trading-settings
  - key: limit_prices
    label: "Limit Buy at Lower Price / Limit Sell at Higher Price (%)"
    api_key: limit_buy_lower_price / limit_sell_higher_price
    unit: pct
    range: "0–100"
    logic: "«-»: лимитный ордер ждёт до 10 мин и снимается, если трейдер закрылся; бэктест его не моделирует"
    status: verified
    source: docs/copy-trading-settings
  - key: limit_timeouts
    label: "Limit Buy not hit → Market Buy (s) / Limit Sell not hit → Market Sell (s)"
    api_key: limit_buy_change_market / limit_sell_change_market
    unit: s
    logic: "«-», пока лимиты выключены (у продажи по умолчанию 3 с)"
    status: verified
    source: docs/copy-trading-settings
  - key: limit_only_open
    label: "Limit Buy Lower Price Only Open"
    api_key: limit_buy_lower_price_only_open
    unit: bool
    default: "OFF"
    logic: "OFF, пока лимиты выключены. В документации поле не описано"
    status: ui
  - key: min_trade_size
    label: "Min Trade Size"
    api_key: min_trade_size
    unit: usd
    logic: "$15 — минимум бота. Размер каждой моей сделки остаётся в диапазоне Min–Max"
    status: verified
    source: docs/copy-trading-settings
  - key: max_trade_size
    label: "Max Trade Size"
    api_key: max_trade_size
    unit: usd
    logic: "Потолок одной моей сделки, чтобы доливки трейдера не раздули позицию"
    status: verified
    source: docs/copy-trading-settings
  - key: buy_times_per_token
    label: "Buy Times Per Token"
    api_key: buy_times_per_token
    unit: int
    logic: "Максимум входов в монету, пока позиция не закрыта полностью (по анализу лестницы входа, часто 1–2)"
    status: verified
    source: docs/copy-trading-settings
  - key: small_copy_size
    label: "Your Copy Size < $15"
    api_key: min_size_copy_buy
    unit: "Skip|Buy"
    default: "OFF = Skip"
    logic: "Копия меньше $15 ждёт 31 с, потом Skip или Buy $15 — по бэктесту (Buy раздувает мелкие доливки — главный риск на $50)"
    status: verified
    source: docs/copy-trading-settings, docs/copytrade
  - key: max_tokens
    label: "Max number of tokens"
    unit: int
    logic: "Сколько позиций трейдера копировать одновременно: из p95 его одновременных позиций, но чтобы всё помещалось в депозит (обычно 1–3)"
    status: verified
    source: docs/copy-trading-settings
  - key: max_token_size_margin
    label: "Max Token Size / Max Token Margin"
    api_key: max_size_per_token / max_margin_per_token
    unit: usd
    logic: "Потолок на монету: $ notional и $ маржи"
    status: verified
    source: docs/copy-trading-settings
  - key: leverage
    label: "Follow Leverage / Max Leverage"
    api_key: follow_leverage
    unit: mode
    default: "OFF = Max Leverage (в форме создания)"
    logic: "Max Leverage (так считает бэктест: исторических плеч трейдера в API нет). В cross-режиме плечо решает только, сколько маржи заблокировано; риск ликвидации задаёт суммарный размер позиций — он ограничен Max number of tokens × Max Token Size"
    status: verified
    source: docs/copy-trading-settings
  - key: max_total_margin
    label: "Max Total Margin"
    api_key: max_total_margin
    unit: usd
    logic: "≤ 80% депозита"
    status: verified
    source: docs/copy-trading-settings
  - key: copy_sides
    label: "Copy Buy / Copy Sell / Copy LONG / Copy SHORT"
    api_key: copy_long / copy_short
    unit: bool
    default: "ON"
    logic: "ON. Copy LONG или SHORT = OFF, только если эта сторона системно убыточна в бэктесте (уменьшения и закрытия копируются всё равно)"
    status: verified
    source: docs/copy-trading-settings
  - key: token_lists
    label: "Token Blacklist / Whitelist"
    unit: list
    logic: "«-» (монеты не ограничиваем)"
    status: verified
    source: docs/copy-trading-settings
  - key: buy_isolated_tokens
    label: "Buy Isolated Margin Tokens"
    unit: bool
    default: "OFF"
    logic: "OFF: монеты только с isolated-маржой не копируются (так считает бэктест)"
    status: verified
    source: docs/copy-trading-settings
  - key: target_min_balance
    label: "Min Balance of Target Wallet"
    api_key: target_min_balance
    unit: usd
    logic: "50% медианного баланса трейдера: если он слил или вывел половину, бот не открывает новые сделки (открытые остаются)"
    status: verified
    source: docs/copy-trading-settings
