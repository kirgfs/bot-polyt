# Общие настройки. Секреты и режим — только в .env (см. .env.example).
# Константы биржи (тики, комиссии, secondsDelay, награды, время старта) здесь не задаются:
# они читаются из API в рантайме (CLAUDE.md, правило 3).

geoblock:
  # docs/api_notes.md §14. Старт — только если ответ разобран, blocked == false
  # и country входит в allowed_countries. Обходы (VPN, прокси) не реализуются.
  url: https://polymarket.com/api/geoblock
  # VPS в Ереване. Страну оператора (Латвия/Армения) он проверяет сам по официальному списку.
  allowed_countries: ["AM"]
  interval_s: 600
  timeout_s: 10
  # Только для периодической проверки: сколько сетевых ошибок подряд терпим до остановки.
  # Ответ blocked или чужая страна — остановка сразу.
  max_consecutive_errors: 3

polymarket:
  # docs/api_notes.md §2 ([SDK] polymarket/environments.py)
  clob_url: https://clob.polymarket.com
  gamma_url: https://gamma-api.polymarket.com
  market_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  sports_ws_url: wss://sports-api.polymarket.com/ws

http:
  timeout_s: 15
  user_agent: polybot-recorder/0.1
